[package]
name = "app"
version = "0.1.0"
description = "AVPlayback — playlist video playback for live events, with remote web control"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.8.1", features = ["dialog-open", "updater"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
rust-embed = "8"
mime_guess = "2"
local-ip-address = "0.6"
open = "5"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio-tungstenite = "0.24"
socket2 = { version = "0.5", features = ["all"] }
gethostname = "0.5"
# HTTP client for pushing media to the backup deck; plain HTTP on the show
# LAN, so TLS stays out of the build.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
